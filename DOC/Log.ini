# VPC3+S - To-Do de Fallos Detectados vs Manual/Guía
# Fuentes: Ultimo_LOG.ini, vpc3pluss_user-manual.txt, VPC_Software_description.txt, Guía Completa
# Formato por ítems: [ID] Título | Síntoma | Esperado | Evidencia | Hipótesis | Acciones

[TD-001] Estado inicial tras reset no es OFFLINE
- Sintoma: STATUS_HL leído 0xE341 inmediatamente tras "hardware reset".
- Esperado: STATUS_L=0x00, STATUS_H=0xE3 (OFFLINE, chip ID VPC3+S).
- Evidencia: L11-L17.
- Hipotesis: Reset HW no estable o lectura temprana; START o writes prematuros antes de OFFLINE.
- Acciones:
  1) Aumentar delay post-reset a 20-50ms; doble verificación de OFFLINE.
  2) Asegurar que no se escribe a 0x08 (Control) ni a mode regs antes de OFFLINE.
  3) Loggear secuencia de reset y confirmar GPIO reset realmente activa el ASIC.

[TD-002] Snapshot inicial de registros de modo incorrecto
- Sintoma: MODE_REG_0_L=0x38, MODE_REG_0_H=0x20, MODE_REG_1=0x50 al inicio.
- Esperado: 0x06=0xC0, 0x07=0x25, 0x15=0x01 (post-init estándar).
- Evidencia: L23-L29 (antes de init); más tarde correctos L205-L211.
- Hipotesis: Lectura antes de terminar init; o direcciones / mapa mal rotulado en logs.
- Acciones:
  1) Forzar write+readback atómicos con verificación y abortar si no coincide.
  2) Revisar rotulación de logs (0x08 mal etiquetado como MODE_REG_0_L).
  3) Releer tras 5-10ms luego de cada write de modo (manual 3.2.x, 3.6).

[TD-003] MODE_REG_3 no respeta write (lee 0x93)
- Sintoma: Se escribe 0x00 a 0x12 pero se lee 0x93 de forma persistente.
- Esperado: 0x12=0x00 (por defecto/según guía).
- Evidencia: L156-L165, L209.
- Hipotesis: Error de bus/endianness/máscara HW; escritura en modo no permitido; alias de dirección.
- Acciones:
  1) Secuencia: GO_OFFLINE -> escribir 0x12 -> leerback -> reintentar N veces -> si falla, log SPI frame y CK/CS timing.
  2) Confirmar mapa de direcciones según interfaz (SPI Intel/Motorola).
  3) Probar a escribir antes/después de START según manual (aunque recomendado OFFLINE).

[TD-004] Memory Test falla (bError=1)
- Sintoma: VPC3_MemoryTest termina con resultado 1 (fail).
- Esperado: Resultado 0 (OK), lectura=escritura en rango permitido.
- Evidencia: L106-L107.
- Hipotesis: Rango pisa áreas reservadas o no inicializadas; comparación incorrecta; side-effects del ASIC.
- Acciones:
  1) Limitar a rango claramente permitido por manual (evitar TS, buffers DP y shadow regs).
  2) Leer-modificar-escribir patrón y restaurar contenido original.
  3) Añadir verificación byte a byte con primer fallo logeado (addr, exp, got).

[TD-005] Rotulación incorrecta en logs para 0x08 (Control)
- Sintoma: "ESCRITURA a MODE_REG_0_L (0x08)".
- Esperado: 0x08 es Control Register; no MODE_REG_0_L (que es 0x06).
- Evidencia: L15, L247, L332, múltiples posteriores.
- Hipotesis: Tabla de nombres en logger equivocada.
- Acciones:
  1) Corregir tabla de mapeo de nombres en `vpc3_spi.c` printf.
  2) Revisar todas las etiquetas de dirección para evitar confusiones de análisis.

[TD-006] PRM/CFG longitudes anómalas (147/140) rechazadas
- Sintoma: En llamadas posteriores se reciben PRM=147, CFG=140 (rechazados).
- Esperado: PRM estándar 7 bytes base; CFG de 2 bytes (según GSD actual).
- Evidencia: L695-L705 y subsecuentes bloques similares.
- Hipotesis: Lectura de puntero equivocada, buffer corrupto, INT_REQ en carrera, máscara incompleta.
- Acciones:
  1) Logear `CFG_PTR(0x34)` y `PRM_PTR` en cada indicación y validar contra TS map.
  2) Tomar snapshot `INT_MASK_L/H` y `INT_REQ_L/H` al entrar en poll (ya agregado).
  3) Asegurar copia de datos desde ASIC no pisa pVpc3->TS (ver offsets y segmentos).

[TD-007] Carrera en IND_DX_OUT durante WAIT_PRM/CFG
- Sintoma: IND_DX_OUT aparece “inesperadamente” durante handshake.
- Esperado: DX_OUT solo tras DATA_EX establecido.
- Evidencia: L479-L493, L706-L719.
- Hipotesis: Procesamiento en polling mezcla bits antiguos; confirmaciones tardías; orden de limpieza de INT_REQ.
- Acciones:
  1) Limpiar/ack preciso de cada indicación (leer req reg y confirmar).
  2) Procesar PRM/CFG primero y posponer DX_OUT hasta estado=DATA_EX.
  3) Añadir filtro por estado DP antes de atender DX_OUT.

[TD-008] Snapshots de registros incongruentes durante operación
- Sintoma: Durante DATA_EX, snapshots muestran MODE_REG_0_H=0xEF, MODE_REG_0_L=0x38, etc.
- Esperado: Valores estables (0x25/0xC0) o sin cambios no documentados.
- Evidencia: L610-L619, L1000-L1009, L1048-L1056, varios.
- Hipotesis: Lectura de banco equivocado/segmento; buffer overlay; lectura mientras ASIC actualiza.
- Acciones:
  1) Bloquear temporalmente interrupciones al hacer snapshot y usar lecturas dobles consistentes.
  2) Validar rutina de lectura que calcula segmentos y direcciones (no leer RS/WR windows).
  3) No leer registros sensibles durante telegramas (usar retardo corto).

[TD-009] Estado DP bitfield cambia 0x45 ↔ 0x41
- Sintoma: STATUS_L alterna entre 0x45 y 0x41 (ambos indican DATA_EX en bits 5-6).
- Esperado: Bits 5-6 = 0x02 (DATA_EX); variaciones en bits de menor orden deben entenderse.
- Evidencia: múltiples (L621, L1011, etc.).
- Hipotesis: Diferencias en subestados/flags (e.g., freeze/sync/salida limpia).
- Acciones:
  1) Decodificar STATUS_L completo (bit por bit) en log y documentar significado (manual 3.2.x/4.9).
  2) Confirmar no confunde con fallos; si estable en 0x41/0x45, solo documentar.

[TD-010] PRM header/Ident vs esperado (verificación ampliada)
- Sintoma: Verificación de PRM base se hizo, pero falta assert continuo en todas rutas.
- Esperado: StationStatus1..3, WD1/2, minTSDR, Ident (0xADAC) coherentes (manual 4.2).
- Evidencia: Aceptado en primer flujo (L355-L361, L363-L365), pero no en rutas 147 bytes.
- Hipotesis: Ruta alternativa usa puntero equivocado y lee basura.
- Acciones:
  1) Imprimir PRM header en cada NEW_PRM_DATA, comparar con Ident esperado; rechazar si mismatch.
  2) Log de punteros/segmentos antes/después de copiar.

[TD-011] Confirmación de transición a DATA_EX tras CFG_OK/UPDATE
- Sintoma: Se imprime DATA_EX luego, pero falta assert inmediato post-OK en todas rutas.
- Esperado: Confirmar transición en <200ms tras respuesta (manual 4.3/4.9).
- Evidencia: Parcial (agregado recientemente).
- Acciones:
  1) Mantener timeout de verificación (200ms) siempre tras CFG_OK/UPDATE.
  2) Si falla, log de INT_REQ y STATUS para entender bloqueo.

[TD-012] Modo de memoria (MODE_REG_2) monitor
- Sintoma: Varios snapshots correctos 0x05, pero hay lecturas 0x09.
- Esperado: 0x05 (2KB, polaridad SYNC -, etc.) según configuración.
- Evidencia: L243-L244 muestran 0x09; resto 0x05.
- Hipotesis: Lectura durante actualización o lectura a dirección errónea.
- Acciones:
  1) Doble lectura y consistencia; si difiere, reléase con retardo corto.
  2) Registrar cuándo y por qué 0x09 (quién escribe 0x09).

[TD-013] Etiquetado de estados internos en ISR
- Sintoma: “ESTADO ACTUAL: 0x40 (Deberia ser WAIT_PRM/CFG)” repetido.
- Esperado: Estado consistente con fase del handshake (WAIT_PRM/WAIT_CFG).
- Evidencia: L343, L398, L694, L702.
- Hipotesis: Cálculo de estado local vs bits de STATUS_L/H; o variable de aplicación no sincronizada.
- Acciones:
  1) Derivar estado únicamente de bits 5-6 de STATUS_L y reportarlo uniformemente.
  2) Alinear enumeraciones de estado app con estados DP reales.

[TD-014] INT_MASK/INT_REQ snapshot en Poll
- Sintoma: Ahora se imprime, pero requiere validación con máscara esperada.
- Esperado: Mascara acorde a manual (habilitar PRM/CFG/DX_OUT/DIAG como corresponda).
- Evidencia: L332-L338, L652-L661, etc.
- Acciones:
  1) Añadir “mask expected” a log (constante/tabla) y comparar.
  2) Si bits inesperados aparecen, investigar origen (DXB_LINK_ERROR, WD_DP_MODE_TIMEOUT).

[TD-015] Decodificación de BAUDRATE en ISR
- Sintoma: Presente en START; falta en camino normal ISR/poll cada vez que aparece BAUDRATE_DETECT.
- Esperado: Decodificación según STATUS_H bits 11..8 (manual 3.2).
- Evidencia: L334 (BAUDRATE_DETECT listado, sin decode).
- Acciones:
  1) Imprimir baudrate humano (kbps) al detectarse en Poll/ISR, no solo en START.

# Fin de To-Do